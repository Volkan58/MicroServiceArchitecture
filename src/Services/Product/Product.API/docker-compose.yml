services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: product-sqlserver
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: w0Lkan@Passw0rd
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
      - product-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'w0Lkan@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: product-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: product-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  product-api:
    build:
      context: ../../..
      dockerfile: Services/Product/Product.API/Dockerfile
    container_name: product-api
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ProductDb;User Id=sa;Password=w0Lkan@Passw0rd;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__ExchangeName: microservice_exchange
      RabbitMQ__QueueName: product_queue
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      Jwt__Secret: "u8Kf7wLQ2Z3mXb9tR6pYvH1nJ5qD4sW8xC2eF0aGkL7mN9pQ3rT6uV1wX2yZ4bH8jK5lM0nP2qR7sT9uV3xY6zA1bC4dE8f"
      Jwt__Issuer: AuthService
      Jwt__Audience: MicroserviceApp
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  product-sqlserver-data:
