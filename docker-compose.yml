services:
  sqlserver-auth:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-auth
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: w0Lkan@Passw0rd
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-auth-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'w0Lkan@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver-product:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-product
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: w0Lkan@Passw0rd
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-product-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'w0Lkan@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver-log:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-log
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: w0Lkan@Passw0rd
      MSSQL_PID: Developer
    ports:
      - "1435:1433"
    volumes:
      - sqlserver-log-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'w0Lkan@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: microservices-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: microservices-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-api:
    build:
      context: ./src/Services/Auth
      dockerfile: Auth.API/Dockerfile
    container_name: auth-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver-auth;Database=AuthDb;User Id=sa;Password=w0Lkan@Passw0rd;TrustServerCertificate=True;"
    depends_on:
      sqlserver-auth:
        condition: service_healthy

  product-api:
    build:
      context: .
      dockerfile: src/Services/Product/Product.API/Dockerfile
    container_name: product-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver-product;Database=ProductDb;User Id=sa;Password=w0Lkan@Passw0rd;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__ExchangeName: microservice_exchange
      RabbitMQ__QueueName: product_queue
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      Jwt__Secret: "u8Kf7wLQ2Z3mXb9tR6pYvH1nJ5qD4sW8xC2eF0aGkL7mN9pQ3rT6uV1wX2yZ4bH8jK5lM0nP2qR7sT9uV3xY6zA1bC4dE8f"
      Jwt__Issuer: AuthService
      Jwt__Audience: MicroserviceApp
    depends_on:
      sqlserver-product:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  log-api:
    build:
      context: .
      dockerfile: src/Services/Log/Log.API/Dockerfile
    container_name: log-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver-log;Database=LogDb;User Id=sa;Password=w0Lkan@Passw0rd;TrustServerCertificate=True;"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__ExchangeName: microservice_exchange
      RabbitMQ__QueueName: log_queue
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
    depends_on:
      sqlserver-log:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__auth__Destinations__auth1__Address: "http://auth-api:8080"
      ReverseProxy__Clusters__products__Destinations__products1__Address: "http://product-api:8080"
      ReverseProxy__Clusters__logs__Destinations__logs1__Address: "http://log-api:8080"
    depends_on:
      - auth-api
      - product-api
      - log-api

volumes:
  sqlserver-auth-data:
  sqlserver-product-data:
  sqlserver-log-data:
