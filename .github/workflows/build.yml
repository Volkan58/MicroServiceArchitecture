name: Build

on:
  push:
    branches: [prod/v1.0.0, test/v1.0.0, master]
  pull_request:
    branches: [prod/v1.0.0, test/v1.0.0]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MicroServiceArchitecture.slnx

      - name: Build
        run: dotnet build MicroServiceArchitecture.slnx --no-restore -c Release
